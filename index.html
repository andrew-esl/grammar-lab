<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammar Lab — англійська граматика</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js?v=4"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .word-chip { transition: all .15s ease; user-select: none; }
    .word-chip:active { transform: scale(.95); }
    .strike-word { text-decoration: line-through; color: #ef4444; background-color: #fee2e2; border-color: #fca5a5; }
    .shadow-inner-soft { box-shadow: inset 0 1px 3px rgba(15,23,42,.06); }
  </style>
</head>
<body class="bg-background text-text-body antialiased min-h-screen">

  <!-- ==================== ЕКРАН ВХОДУ ==================== -->
  <div id="login-screen" class="hidden min-h-screen flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-sm">
      <div class="flex items-center justify-center gap-2.5 mb-6">
        <div class="w-9 h-9 rounded-xl bg-secondary text-text-inverse flex items-center justify-center font-bold text-heading-md">G</div>
        <span class="text-heading-xl font-bold text-text-primary tracking-tight">Grammar Lab</span>
      </div>
      <form id="login-form" class="bg-surface border border-border-default rounded-2xl shadow-sm p-7 space-y-4">
        <div>
          <h1 class="text-heading-lg font-bold text-text-primary">Вхід</h1>
          <p class="text-body-sm text-text-muted mt-1">Увійдіть, щоб продовжити заняття.</p>
        </div>
        <div class="space-y-3">
          <label class="block">
            <span class="block text-caption-bold uppercase tracking-wider text-text-muted mb-1.5">Пошта</span>
            <input id="login-email" type="email" autocomplete="username"
              class="w-full px-3 py-2.5 text-body-base bg-surface-subtle border border-transparent rounded-xl text-text-primary placeholder:text-text-tertiary focus:outline-none focus:bg-surface focus:border-secondary transition">
          </label>
          <label class="block">
            <span class="block text-caption-bold uppercase tracking-wider text-text-muted mb-1.5">Пароль</span>
            <input id="login-password" type="password" autocomplete="current-password"
              class="w-full px-3 py-2.5 text-body-base bg-surface-subtle border border-transparent rounded-xl text-text-primary placeholder:text-text-tertiary focus:outline-none focus:bg-surface focus:border-secondary transition">
          </label>
        </div>
        <p id="login-error" class="hidden text-caption-xs text-error font-medium bg-error-surface border border-error-border rounded-lg px-3 py-2"></p>
        <button id="login-submit" type="submit"
          class="w-full bg-text-primary hover:bg-secondary disabled:opacity-60 text-text-inverse text-body-semibold py-2.5 rounded-xl transition shadow-sm">
          Увійти
        </button>
        <p class="text-caption-xs text-text-tertiary text-center">Доступ видає викладач.</p>
      </form>
    </div>
  </div>

  <!-- ==================== САЙТ ==================== -->
  <div id="app-shell" class="hidden">

    <!-- Бічне меню тем -->
    <div id="sidebar-backdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-text-primary/40 z-40 hidden"></div>
    <aside id="sidebar-drawer"
      class="fixed top-0 left-0 h-full w-80 max-w-[85vw] bg-surface border-r border-border-default z-50 transform -translate-x-full transition-transform duration-200 ease-in-out flex flex-col shadow-xl">
      <div class="p-4 border-b border-border-default flex items-center justify-between">
        <span class="text-heading-md font-semibold text-text-primary">Теми курсу</span>
        <button onclick="toggleSidebar()" class="p-1.5 rounded-lg text-text-muted hover:text-text-primary hover:bg-surface-subtle transition" aria-label="Закрити">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div id="level-filter-box" class="hidden p-4 bg-surface-subtle border-b border-border-default space-y-2">
        <label class="block text-caption-bold uppercase tracking-wider text-text-muted">Перегляд рівня · лише викладач</label>
        <select id="student-level-select" onchange="changeStudentLevel(this.value)"
          class="w-full px-3 py-2 bg-surface border border-border-input rounded-lg text-body-medium text-text-primary focus:outline-none focus:border-secondary">
          <option value="all">Усі рівні</option>
          <option value="elementary">Elementary</option>
          <option value="intermediate">Intermediate</option>
          <option value="advanced">Advanced</option>
        </select>
      </div>

      <div id="sidebar-topics-list" class="p-3 overflow-y-auto flex-1 space-y-1.5"></div>
    </aside>

    <!-- Шапка -->
    <header class="sticky top-0 z-30 bg-surface/90 backdrop-blur-md border-b border-border-default">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <button onclick="toggleSidebar()"
            class="flex items-center gap-2 bg-surface-subtle hover:bg-surface-muted text-text-primary text-caption-xs font-semibold px-3 py-2 rounded-xl transition shrink-0">
            <svg class="w-4 h-4 text-secondary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            <span class="hidden sm:inline">Теми</span>
          </button>
          <div class="min-w-0">
            <div class="text-micro uppercase tracking-wider text-text-tertiary hidden sm:block">Grammar Lab</div>
            <h1 id="current-topic-title" class="text-heading-md sm:text-heading-lg font-bold text-text-primary truncate leading-tight">Завантаження…</h1>
          </div>
        </div>

        <div class="flex items-center gap-2 shrink-0">
          <div class="hidden md:flex items-center gap-3 bg-surface-subtle px-3.5 py-2 rounded-xl">
            <div class="w-32 lg:w-40">
              <div class="flex justify-between text-micro font-semibold mb-1">
                <span class="text-text-muted">Прогрес</span>
                <span id="progress-text" class="text-secondary">0%</span>
              </div>
              <div class="w-full bg-surface-muted h-1.5 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-secondary h-full rounded-full transition-all duration-300" style="width:0%"></div>
              </div>
            </div>
            <button id="reset-btn" onclick="resetProgress()" title="Скидає прогрес лише поточної теми"
              class="hidden text-text-muted hover:text-error transition" aria-label="Скинути тему">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v6h6M3.5 13a9 9 0 103-7.7L3 8"/></svg>
            </button>
          </div>

          <a id="cabinet-link" href="teacher.html"
            class="hidden items-center gap-1.5 text-caption-xs font-semibold text-secondary hover:text-interactive-hover bg-interactive-subtle px-3 py-2 rounded-xl transition">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span class="hidden sm:inline">Кабінет</span>
          </a>

          <div class="flex items-center gap-2 pl-1">
            <span id="user-badge" class="hidden lg:block text-caption-xs text-text-muted font-medium max-w-[160px] truncate"></span>
            <button onclick="apiSignOut()" class="p-2 rounded-xl text-text-muted hover:text-error hover:bg-surface-subtle transition" title="Вийти" aria-label="Вийти">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6">
      <!-- Вкладки -->
      <div class="flex gap-1 border-b border-border-default mb-6">
        <button onclick="switchMainTab('theory')" id="tab-btn-theory" class="flex items-center gap-2 px-5 py-3 text-body-semibold border-b-2 rounded-t-lg transition">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20M4 19.5V5a2 2 0 012-2h14v14M4 19.5A2.5 2.5 0 016.5 22H20v-5"/></svg>
          Теорія
        </button>
        <button onclick="switchMainTab('practice')" id="tab-btn-practice" class="flex items-center gap-2 px-5 py-3 text-body-semibold border-b-2 rounded-t-lg transition">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
          Вправи
        </button>
      </div>

      <!-- Теорія -->
      <section id="section-theory" class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        <div id="theory-list" class="lg:col-span-8 space-y-5"></div>
        <aside id="theory-aside" class="lg:col-span-4 lg:sticky lg:top-24"></aside>
      </section>

      <!-- Вправи -->
      <section id="section-practice" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        <div id="exercises-list" class="lg:col-span-8 space-y-6"></div>
        <aside id="practice-aside" class="lg:col-span-4 lg:sticky lg:top-24"></aside>
      </section>
    </main>

    <footer class="border-t border-border-default mt-10 py-8">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-2 text-caption-xs text-text-tertiary">
        <span>Grammar Lab · тренажер з англійської граматики</span>
        <span id="footer-topic-count"></span>
      </div>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <!-- ?v=N — захист від кешу браузера: ПІСЛЯ КОЖНОЇ ЗМІНИ у js/*.js
       збільшуйте номер, інакше відвідувач може отримати стару версію файлу. -->
  <script src="js/config.js?v=4"></script>
  <script src="js/api.js?v=4"></script>
  <script src="js/engine.js?v=4"></script>
  <script src="js/auth.js?v=4"></script>
</body>
</html>
