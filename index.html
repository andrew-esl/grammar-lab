<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammar Lab — Англійська грамматика</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .word-chip { transition: all 0.15s ease; user-select: none; }
    .word-chip:active { transform: scale(0.95); }
    .strike-word { text-decoration: line-through; color: #ef4444; background-color: #fee2e2; border-color: #fca5a5; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-16">

  <!-- ==================== ЕКРАН ВХОДУ ==================== -->
  <div id="login-screen" class="hidden min-h-screen flex items-center justify-center px-4">
    <form id="login-form" class="w-full max-w-sm bg-white border border-slate-200 rounded-2xl shadow-sm p-7 space-y-4">
      <div>
        <h1 class="text-xl font-bold text-slate-900">Grammar Lab</h1>
        <p class="text-sm text-slate-500 mt-1">Увійдіть, щоб продовжити заняття.</p>
      </div>
      <div class="space-y-3">
        <input id="login-email" type="email" autocomplete="username" placeholder="Електронна пошта"
          class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:border-indigo-600">
        <input id="login-password" type="password" autocomplete="current-password" placeholder="Пароль"
          class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:border-indigo-600">
      </div>
      <p id="login-error" class="hidden text-xs text-rose-600 font-medium"></p>
      <button id="login-submit" type="submit"
        class="w-full bg-slate-900 hover:bg-indigo-600 disabled:opacity-60 text-white text-sm font-semibold py-2.5 rounded-lg transition">
        Увійти
      </button>
      <p class="text-xs text-slate-400 text-center">Доступ видає викладач.</p>
    </form>
  </div>

  <!-- ==================== САЙТ (після входу) ==================== -->
  <div id="app-shell" class="hidden">

  <!-- Випадаюче ліве меню (Drawer) для вибору тем та рівнів -->
  <div id="sidebar-backdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/40 z-40 hidden transition-opacity"></div>
  <aside id="sidebar-drawer" class="fixed top-0 left-0 h-full w-80 bg-white border-r border-slate-200 z-50 transform -translate-x-full transition-transform duration-200 ease-in-out flex flex-col shadow-xl">
    <div class="p-4 border-b border-slate-200 flex items-center justify-between">
      <span class="font-bold text-slate-900 text-base">Теми курсу</span>
      <button onclick="toggleSidebar()" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100">
        ✕
      </button>
    </div>
    
    <!-- Налаштування рівня учня -->
    <div id="level-filter-box" class="hidden p-4 bg-slate-50 border-b border-slate-200 space-y-2">
      <label class="block text-xs font-bold uppercase tracking-wider text-slate-500">Перегляд рівня (лише для викладача)</label>
      <select id="student-level-select" onchange="changeStudentLevel(this.value)" class="w-full px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-sm font-medium text-slate-700 focus:outline-none focus:border-indigo-600">
        <option value="all">Усі рівні (Повний матеріал)</option>
        <option value="elementary">Elementary (Базовий)</option>
        <option value="intermediate">Intermediate (Середній)</option>
        <option value="advanced">Advanced (Поглиблений)</option>
      </select>
    </div>

    <!-- Динамічний список тем -->
    <div id="sidebar-topics-list" class="p-3 overflow-y-auto flex-1 space-y-1"></div>
  </aside>

  <!-- Верхній навігаційний бар -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold px-3.5 py-2 rounded-xl text-sm transition border border-slate-200">
          <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
          <span>Меню</span>
        </button>

        <h1 id="current-topic-title" class="font-bold text-slate-900 text-lg sm:text-xl leading-tight">
          Завантаження...
        </h1>
      </div>

      <div class="flex items-center gap-4 bg-slate-100 px-4 py-2 rounded-xl border border-slate-200">
        <div class="w-36 sm:w-48">
          <div class="flex justify-between text-xs font-semibold mb-1">
            <span class="text-slate-600">Прогрес:</span>
            <span id="progress-text" class="text-indigo-600">0%</span>
          </div>
          <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
            <div id="progress-bar" class="bg-indigo-600 h-full transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>
        <button id="reset-btn" onclick="resetProgress()" title="Скидає прогрес лише поточної теми" class="hidden text-xs text-slate-500 hover:text-rose-600 font-medium px-2 py-1 rounded hover:bg-slate-200/60 transition">
          Скинути тему
        </button>
      </div>

      <div class="flex items-center gap-2 text-xs">
        <a id="cabinet-link" href="teacher.html" class="hidden font-semibold text-indigo-600 hover:text-indigo-800 bg-indigo-50 px-3 py-1.5 rounded-lg">Кабінет</a>
        <span id="user-badge" class="text-slate-500 font-medium"></span>
        <button onclick="apiSignOut()" class="text-slate-500 hover:text-rose-600 font-medium px-2 py-1 rounded hover:bg-slate-100 transition">
          Вийти
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 mt-6">
    <!-- Перемикач Режимів: Теорія vs Практика -->
    <div class="flex border-b border-slate-200 mb-6 gap-2">
      <button onclick="switchMainTab('theory')" id="tab-btn-theory" class="px-6 py-3 font-semibold text-sm rounded-t-xl border-b-2 border-indigo-600 text-indigo-600 bg-white">
        Теорія
      </button>
      <button onclick="switchMainTab('practice')" id="tab-btn-practice" class="px-6 py-3 font-semibold text-sm rounded-t-xl border-b-2 border-transparent text-slate-500 hover:text-slate-800">
        Вправи
      </button>
    </div>

    <!-- ==================== СЕКЦІЯ ТЕОРІЇ (Динамічна) ==================== -->
    <section id="section-theory" class="space-y-6"></section>

    <!-- ==================== СЕКЦІЯ ПРАКТИКИ (Динамічна) ==================== -->
    <section id="section-practice" class="hidden space-y-6">
      <div id="exercises-list" class="space-y-8"></div>
    </section>
  </main>


  </div><!-- /app-shell -->

  <!-- Клієнт Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <!-- Параметри підключення, доступ до бази, вхід, рушій. Порядок важливий.
       ?v=N — захист від кешу браузера: ПІСЛЯ КОЖНОЇ ЗМІНИ у js/*.js
       збільшуйте номер, інакше відвідувач може отримати стару версію файлу. -->
  <script src="js/config.js?v=3"></script>
  <script src="js/api.js?v=3"></script>
  <script src="js/engine.js?v=3"></script>
  <script src="js/auth.js?v=3"></script>
</body>
</html>
