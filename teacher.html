<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кабінет викладача — Grammar Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js?v=5"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .tab-on  { border-color: #4b41e1; color: #4b41e1; background: #fff; }
    .tab-off { border-color: transparent; color: #64748b; }
    .saved-flash { animation: flash 1.2s ease; }
    @keyframes flash { 0% { opacity: 1 } 70% { opacity: 1 } 100% { opacity: 0 } }
  </style>
</head>
<body class="bg-background text-text-body antialiased min-h-screen">

  <!-- Повідомлення для тих, кому сюди не можна -->
  <div id="gate" class="min-h-screen flex items-center justify-center px-4">
    <p id="gate-text" class="text-body-base text-text-muted">Завантаження…</p>
  </div>

  <div id="cabinet" class="hidden">
    <header class="bg-surface/90 backdrop-blur-md border-b border-border-default sticky top-0 z-30">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-xl bg-secondary text-text-inverse flex items-center justify-center font-bold text-body-semibold">G</div>
          <div>
            <div class="text-micro uppercase tracking-wider text-text-tertiary">Grammar Lab</div>
            <h1 class="text-heading-md font-bold text-text-primary leading-tight">Кабінет викладача</h1>
          </div>
          <a href="index.html" class="ml-2 flex items-center gap-1.5 text-caption-xs font-semibold text-secondary hover:text-interactive-hover bg-interactive-subtle px-3 py-2 rounded-xl transition">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            До тренажера
          </a>
        </div>
        <div class="flex items-center gap-2">
          <span id="teacher-name" class="text-caption-xs text-text-muted font-medium"></span>
          <button onclick="apiSignOut()" class="p-2 rounded-xl text-text-muted hover:text-error hover:bg-surface-subtle transition" title="Вийти" aria-label="Вийти">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 grid lg:grid-cols-[280px_1fr] gap-6">

      <!-- ===== Список учнів ===== -->
      <aside class="space-y-3">
        <button onclick="openCreateModal()" class="w-full bg-text-primary hover:bg-secondary text-text-inverse text-body-semibold py-2.5 rounded-xl transition shadow-sm">
          + Додати учня
        </button>
        <input id="student-search" oninput="renderStudentList()" placeholder="Пошук за імʼям чи поштою"
          class="w-full px-3 py-2 text-body-base border border-border-input rounded-lg bg-surface text-text-primary placeholder:text-text-tertiary focus:outline-none focus:border-secondary transition">
        <div id="student-list" class="space-y-1.5"></div>
      </aside>

      <!-- ===== Картка учня ===== -->
      <section id="student-panel" class="min-w-0">
        <div class="bg-surface border border-border-default rounded-2xl p-8 text-center text-text-muted text-body-base">
          Оберіть учня ліворуч або додайте нового.
        </div>
      </section>
    </main>
  </div>

  <!-- ===== Модальне вікно: новий учень ===== -->
  <div id="create-modal" class="hidden fixed inset-0 bg-text-primary/40 z-50 flex items-center justify-center px-4">
    <div class="bg-surface rounded-2xl shadow-xl w-full max-w-md p-6 space-y-4">
      <div id="create-form-wrap" class="space-y-4">
        <h2 class="text-heading-lg font-bold text-text-primary">Новий учень</h2>
        <div class="space-y-3">
          <input id="new-name" placeholder="Імʼя та прізвище" class="w-full px-3 py-2 text-body-base border border-border-input rounded-lg bg-surface text-text-primary placeholder:text-text-tertiary focus:outline-none focus:border-secondary transition">
          <input id="new-email" type="email" placeholder="Електронна пошта" class="w-full px-3 py-2 text-body-base border border-border-input rounded-lg bg-surface text-text-primary placeholder:text-text-tertiary focus:outline-none focus:border-secondary transition">
          <div class="flex gap-2">
            <input id="new-password" placeholder="Пароль (від 8 символів)" class="flex-1 px-3 py-2 text-body-base border border-border-input rounded-lg bg-surface text-text-primary placeholder:text-text-tertiary focus:outline-none focus:border-secondary transition font-mono">
            <button type="button" onclick="document.getElementById('new-password').value = generatePassword()" class="text-caption-bold px-3 rounded-lg border border-border-input hover:border-secondary transition">Згенерувати</button>
          </div>
        </div>
        <p id="create-error" class="hidden text-caption-xs text-error font-medium bg-error-surface border border-error-border rounded-lg px-3 py-2"></p>
        <div class="flex justify-end gap-2">
          <button onclick="closeCreateModal()" class="text-body-medium px-4 py-2 rounded-lg text-text-secondary hover:bg-surface-subtle transition">Скасувати</button>
          <button id="create-submit" onclick="submitCreateStudent()" class="text-body-semibold px-4 py-2 rounded-xl bg-text-primary hover:bg-secondary text-text-inverse disabled:opacity-60 transition shadow-sm">Створити</button>
        </div>
      </div>
      <div id="create-done" class="hidden space-y-4">
        <h2 class="text-heading-lg font-bold text-success-emphasis">Учня створено</h2>
        <p class="text-body-base text-text-secondary">Передайте учневі дані для входу. Пароль більше ніде не відображатиметься — збережіть або надішліть зараз.</p>
        <pre id="created-creds" class="bg-surface-subtle border border-border-default rounded-lg p-3 text-body-sm font-mono whitespace-pre-wrap"></pre>
        <div class="flex justify-end gap-2">
          <button onclick="copyCreds()" id="copy-btn" class="text-body-semibold px-4 py-2 rounded-xl border border-border-input hover:border-secondary transition">Копіювати</button>
          <button onclick="closeCreateModal()" class="text-body-semibold px-4 py-2 rounded-xl bg-text-primary hover:bg-secondary text-text-inverse transition shadow-sm">Готово</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <!-- ?v=N: збільшуйте після кожної зміни у js/*.js (захист від кешу браузера) -->
  <script src="js/config.js?v=5"></script>
  <script src="js/api.js?v=5"></script>
  <script src="js/exercise-text.js?v=5"></script>
  <script src="js/teacher.js?v=5"></script>
</body>
</html>
