<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кабінет викладача — Grammar Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .tab-on  { border-color: #4f46e5; color: #4f46e5; background: #fff; }
    .tab-off { border-color: transparent; color: #64748b; }
    .saved-flash { animation: flash 1.2s ease; }
    @keyframes flash { 0% { opacity: 1 } 70% { opacity: 1 } 100% { opacity: 0 } }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- Повідомлення для тих, кому сюди не можна -->
  <div id="gate" class="min-h-screen flex items-center justify-center px-4">
    <p id="gate-text" class="text-slate-500 text-sm">Завантаження…</p>
  </div>

  <div id="cabinet" class="hidden">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
      <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <h1 class="font-bold text-slate-900 text-lg">Кабінет викладача</h1>
          <a href="index.html" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 bg-indigo-50 px-3 py-1.5 rounded-lg">← До тренажера</a>
        </div>
        <div class="flex items-center gap-2 text-xs">
          <span id="teacher-name" class="text-slate-500 font-medium"></span>
          <button onclick="apiSignOut()" class="text-slate-500 hover:text-rose-600 font-medium px-2 py-1 rounded hover:bg-slate-100">Вийти</button>
        </div>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 grid lg:grid-cols-[280px_1fr] gap-6">

      <!-- ===== Список учнів ===== -->
      <aside class="space-y-3">
        <button onclick="openCreateModal()" class="w-full bg-slate-900 hover:bg-indigo-600 text-white text-sm font-semibold py-2.5 rounded-xl transition">
          + Додати учня
        </button>
        <input id="student-search" oninput="renderStudentList()" placeholder="Пошук за імʼям чи поштою"
          class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white focus:outline-none focus:border-indigo-600">
        <div id="student-list" class="space-y-1.5"></div>
      </aside>

      <!-- ===== Картка учня ===== -->
      <section id="student-panel" class="min-w-0">
        <div class="bg-white border border-slate-200 rounded-2xl p-8 text-center text-slate-500 text-sm">
          Оберіть учня ліворуч або додайте нового.
        </div>
      </section>
    </main>
  </div>

  <!-- ===== Модальне вікно: новий учень ===== -->
  <div id="create-modal" class="hidden fixed inset-0 bg-slate-900/40 z-50 flex items-center justify-center px-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 space-y-4">
      <div id="create-form-wrap" class="space-y-4">
        <h2 class="text-lg font-bold text-slate-900">Новий учень</h2>
        <div class="space-y-3">
          <input id="new-name" placeholder="Імʼя та прізвище" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:border-indigo-600">
          <input id="new-email" type="email" placeholder="Електронна пошта" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:border-indigo-600">
          <div class="flex gap-2">
            <input id="new-password" placeholder="Пароль (від 8 символів)" class="flex-1 px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:border-indigo-600 font-mono">
            <button type="button" onclick="document.getElementById('new-password').value = generatePassword()" class="text-xs font-semibold px-3 rounded-lg border border-slate-300 hover:border-indigo-500">Згенерувати</button>
          </div>
        </div>
        <p id="create-error" class="hidden text-xs text-rose-600 font-medium"></p>
        <div class="flex justify-end gap-2">
          <button onclick="closeCreateModal()" class="text-sm px-4 py-2 rounded-lg text-slate-600 hover:bg-slate-100">Скасувати</button>
          <button id="create-submit" onclick="submitCreateStudent()" class="text-sm font-semibold px-4 py-2 rounded-lg bg-slate-900 hover:bg-indigo-600 text-white disabled:opacity-60">Створити</button>
        </div>
      </div>
      <div id="create-done" class="hidden space-y-4">
        <h2 class="text-lg font-bold text-emerald-700">Учня створено</h2>
        <p class="text-sm text-slate-600">Передайте учневі дані для входу. Пароль більше ніде не відображатиметься — збережіть або надішліть зараз.</p>
        <pre id="created-creds" class="bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm whitespace-pre-wrap"></pre>
        <div class="flex justify-end gap-2">
          <button onclick="copyCreds()" id="copy-btn" class="text-sm font-semibold px-4 py-2 rounded-lg border border-slate-300 hover:border-indigo-500">Копіювати</button>
          <button onclick="closeCreateModal()" class="text-sm font-semibold px-4 py-2 rounded-lg bg-slate-900 hover:bg-indigo-600 text-white">Готово</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <!-- ?v=N: збільшуйте після кожної зміни у js/*.js (захист від кешу браузера) -->
  <script src="js/config.js?v=3"></script>
  <script src="js/api.js?v=3"></script>
  <script src="js/exercise-text.js?v=3"></script>
  <script src="js/teacher.js?v=3"></script>
</body>
</html>
